<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정모의 카페 스토리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-sized story player (dark only). Each account is a cube face with its own progress bars; reply opens a Korean keyboard */
:root{
  --bg:#000; --stage:#0b0b0d; --fg:#fff; --dim:rgba(255,255,255,.7); --track:rgba(255,255,255,.35);
  --field:rgba(255,255,255,.45); --kb:#1e1e20; --key:#5b5b5f; --key-fn:#3b3b3e; --key-hit:#8e8e93;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--fg);font-family:var(--font);display:flex;justify-content:center;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.viewer{position:relative;width:100%;max-width:420px;height:100%;background:var(--bg);overflow:hidden;perspective:1100px}
@media (min-width:520px){
  body{align-items:center;padding-block:24px}
  .viewer{height:min(860px,100%);border-radius:24px}
}

/* one face per account */
.face{position:absolute;inset:0;overflow:hidden;background:var(--bg);backface-visibility:hidden;display:flex;flex-direction:column}
.face[hidden]{display:none!important}
.face::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.card{position:relative;flex:1;min-height:0;margin-top:6px;border-radius:10px;overflow:hidden;background:#111}
.card img.photo{width:100%;height:100%;object-fit:cover;display:block}
.card::before{content:"";position:absolute;inset:0 0 auto;height:120px;background:linear-gradient(rgba(0,0,0,.4),transparent);z-index:1;pointer-events:none}

.top{position:absolute;left:0;right:0;top:0;z-index:3;padding:8px 8px 0}
.bars{display:flex;gap:3px}
.bar{flex:1;height:2px;border-radius:2px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--fg)}
.head{display:flex;align-items:center;gap:8px;margin-top:9px;padding:0 4px}
.pic{width:32px;height:32px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;background:#c7c8cc}
.pic img{width:100%;height:100%;object-fit:cover}
.pic svg{width:24px;height:24px;margin-top:7px;color:#f1f1f3}
.head b{font-size:13.5px;font-weight:700}
.head span{font-size:13px;color:var(--dim)}
.head .icons{margin-left:auto;display:flex;gap:16px;align-items:center}
.head svg.i{width:24px;height:24px;color:var(--fg)}

.tap{position:absolute;inset:70px 0 0;z-index:2;display:flex}
.tap button{flex:1;background:none;border:0;cursor:pointer;padding:0}
.tap button:focus-visible{outline:2px solid var(--fg);outline-offset:-4px}

.dim{position:absolute;inset:0;z-index:4;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.dim.on{opacity:1}

.reply{flex:none;position:relative;z-index:5;display:flex;align-items:center;gap:16px;padding:10px 12px 12px;background:var(--bg);
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.field{flex:1;min-width:0;border:1px solid var(--field);border-radius:22px;padding:10px 16px;font-size:14px;color:var(--fg);
  background:transparent;text-align:left;font-family:var(--font);cursor:pointer;height:42px;white-space:pre;overflow:hidden;line-height:20px}
.field.ph{color:var(--dim)}
.field.nudge{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 5px rgba(255,255,255,.2)}}
.field:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.reply .acts{display:flex;gap:16px}
.reply .acts svg{width:25px;height:25px;color:var(--fg)}
.reply .sendtxt{display:none;font-size:15px;font-weight:700;color:#7a8cff;opacity:.45;padding-right:4px}
.typing .acts{display:none}.typing .sendtxt{display:block}
.caret{display:inline-block;width:1.5px;height:1.05em;background:#7a8cff;vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* keyboard */
.kb{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--kb);padding:8px 3px calc(30px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:11px}
.kb.on{transform:none}
.krow{display:flex;gap:6px;justify-content:center;padding:0 3px}
.k{flex:1;max-width:36px;height:43px;border-radius:5px;background:var(--key);display:grid;place-items:center;font-size:20px;color:var(--fg);
  box-shadow:0 1px 0 rgba(0,0,0,.5);transition:background .08s}
.k.fn{background:var(--key-fn);font-size:15px}
.k.w{flex:none;width:44px;max-width:none}
.k.space{flex:4;max-width:none;font-size:15px}
.k.send{flex:none;width:88px;max-width:none;background:#3478f6;font-size:15px}
.k svg{width:22px;height:22px}
.k.hit{background:var(--key-hit)}
.krow.mid{padding:0 20px}

/* first-visit hint */
.coach{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(0,0,0,.6);transition:opacity .3s;cursor:pointer}
.coach.gone{opacity:0;pointer-events:none}
.coach .box{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px}
.coach svg{width:54px;height:54px;color:var(--fg);animation:tapme 1.4s ease-in-out infinite}
@keyframes tapme{0%,100%{transform:translateX(0)}50%{transform:translateX(10px) scale(.94)}}
.coach p{margin:0;font-size:16px;font-weight:500;line-height:1.5}
.coach small{font-size:13px;color:var(--dim)}

.black{position:absolute;inset:0;z-index:9;background:#000;opacity:0;pointer-events:none;transition:opacity 1.4s ease-in}
.black.on{opacity:1;pointer-events:auto}
.black{display:grid;place-items:center;padding:24px}
.black p{margin:0;color:#e9e9ee;font-size:16px;line-height:1.7;text-align:center;text-wrap:balance;opacity:0}
.black.on p{animation:fadein 1s ease-out 1.6s both}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* cube turn between accounts */
.out-fwd{transform-origin:100% 50%;animation:outF .55s cubic-bezier(.45,.05,.35,1) forwards}
.in-fwd{transform-origin:0% 50%;animation:inF .55s cubic-bezier(.45,.05,.35,1) forwards}
.out-back{transform-origin:0% 50%;animation:outB .55s cubic-bezier(.45,.05,.35,1) forwards}
.in-back{transform-origin:100% 50%;animation:inB .55s cubic-bezier(.45,.05,.35,1) forwards}
@keyframes outF{to{transform:translateX(-100%) rotateY(-90deg)}}
@keyframes inF{from{transform:translateX(100%) rotateY(90deg)}to{transform:none}}
@keyframes outB{to{transform:translateX(100%) rotateY(90deg)}}
@keyframes inB{from{transform:translateX(-100%) rotateY(-90deg)}to{transform:none}}
.out-fwd::after,.out-back::after{animation:shadeOut .55s forwards}
.in-fwd::after,.in-back::after{animation:shadeIn .55s forwards}
@keyframes shadeOut{to{opacity:.6}}
@keyframes shadeIn{from{opacity:.6}to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>

<style>body{margin:0}</style>

<script>
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r=>setTimeout(r, reduce?0:ms));
const faces = [$('f0'), $('f1')];
const DUR = [6000, 7000];
const field = $('field');

/* ---------- keyboard ---------- */
const rows = [['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ']];
const kbEl = $('kb'), keyMap = {};
function key(label, cls=''){ const k=document.createElement('div'); k.className='k '+cls; if(label.startsWith('<')) k.innerHTML=label; else k.textContent=label; return k; }
rows.forEach((r,i)=>{
  const row=document.createElement('div'); row.className='krow'+(i===1?' mid':'');
  if(i===2){ const s=key('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 4l8 8h-4.5v7h-7v-7H4z"/></svg>','fn w'); row.appendChild(s); keyMap.shift=s; }
  r.forEach(j=>{ const k=key(j); keyMap[j]=k; row.appendChild(k); });
  if(i===2){ const b=key('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5m0-5l-5 5" stroke-linecap="round"/></svg>','fn w'); row.appendChild(b); keyMap.back=b; }
  kbEl.appendChild(row);
});
{ const row=document.createElement('div'); row.className='krow';
  const n=key('123','fn w'); const e=key('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r=".8" fill="currentColor"/><circle cx="15" cy="10" r=".8" fill="currentColor"/><path d="M8.5 14a4 4 0 0 0 7 0" stroke-linecap="round"/></svg>','fn w');
  const sp=key('스페이스','space'); const go=key('전송','send');
  keyMap.num=n; keyMap.space=sp; [n,e,sp,go].forEach(k=>row.appendChild(k)); kbEl.appendChild(row); }

const L='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
const V='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
const T=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const SPLIT={'ㄲ':['shift','ㄱ'],'ㄸ':['shift','ㄷ'],'ㅃ':['shift','ㅂ'],'ㅆ':['shift','ㅅ'],'ㅉ':['shift','ㅈ'],'ㅒ':['shift','ㅐ'],'ㅖ':['shift','ㅔ'],
 'ㅘ':['ㅗ','ㅏ'],'ㅙ':['ㅗ','ㅐ'],'ㅚ':['ㅗ','ㅣ'],'ㅝ':['ㅜ','ㅓ'],'ㅞ':['ㅜ','ㅔ'],'ㅟ':['ㅜ','ㅣ'],'ㅢ':['ㅡ','ㅣ'],
 'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
const ex = j => SPLIT[j] || [j];
function keysFor(ch){
  const c = ch.charCodeAt(0)-0xAC00;
  if (c>=0 && c<11172){ const l=Math.floor(c/588), v=Math.floor(c%588/28), t=c%28;
    return [...ex(L[l]), ...ex(V[v]), ...(t?ex(T[t]):[])]; }
  if (ch===' ') return ['space'];
  return ['num'];
}
async function hit(name, ms=70){ const k=keyMap[name]; if(!k) return; k.classList.add('hit'); await wait(ms); k.classList.remove('hit'); }

/* ---------- story playback ---------- */
let cur=0, elapsed=0, paused=true, started=false, replied=false, busy=false, ended=false, turning=false, last=0;
function bar(i){ return faces[i].querySelector('.bar i'); }
function loop(now){
  const dt = now-last; last = now;
  if(!paused && !turning && !ended){
    elapsed += dt;
    const pct = Math.min(1, elapsed/DUR[cur]);
    bar(cur).style.width = pct*100+'%';
    if(pct>=1){
      if(cur===0) turn(0,1);
      else if(replied) finish();
      else paused = true; // hold until the reply scene finishes
    }
  }
  requestAnimationFrame(loop);
}
function turn(from,to){
  if(turning) return; turning=true;
  const fwd = to>from, a=faces[from], b=faces[to];
  b.hidden=false;
  a.classList.add(fwd?'out-fwd':'out-back'); b.classList.add(fwd?'in-fwd':'in-back');
  setTimeout(()=>{
    a.hidden=true; a.className='face'; b.className='face';
    bar(from).style.width = fwd?'100%':'0%';
    cur=to; elapsed=0; bar(to).style.width='0%'; turning=false;
    if(to===1 && !replied) setTimeout(openReply, reduce?0:1800);
  }, reduce?10:560);
}
faces.forEach((f,i)=>{
  f.querySelector('.next').addEventListener('click',()=>{ if(!started||busy) return; if(i===0) turn(0,1); else if(replied) finish(); });
  f.querySelector('.prev').addEventListener('click',()=>{ if(!started||busy) return; if(i===1) turn(1,0); else { elapsed=0; } });
});
$('coach').addEventListener('click',()=>{ $('coach').classList.add('gone'); started=true; paused=false; });

/* ---------- reply: type, hesitate, erase ---------- */
function caret(){ field.insertAdjacentHTML('beforeend','<span class="caret"></span>'); }
async function typeInto(t){
  field.classList.remove('ph'); field.textContent=''; caret();
  let shown='';
  for(const ch of [...t]){
    for(const k of keysFor(ch)) { await hit(k); await wait(45); }
    shown += ch; field.textContent=shown; caret();
    await wait(60);
  }
}
async function erase(){
  let chars=[...field.textContent];
  while(chars.length){ hit('back',60); chars.pop(); field.textContent=chars.join(''); caret(); await wait(110); }
}
async function openReply(){
  if(cur!==1 || replied || busy || turning) return;
  busy=true; paused=true;
  field.classList.remove('nudge');
  const reply=$('reply1');
  reply.classList.add('typing'); field.classList.remove('ph'); field.textContent=''; caret();
  $('dim').classList.add('on'); kbEl.classList.add('on');
  reply.style.transform = 'translateY(-'+(kbEl.offsetHeight - parseFloat(getComputedStyle(reply).paddingBottom) + 6)+'px)';
  await wait(800);
  await typeInto('다른 카페 가셨네요…?');
  await wait(1500);
  await erase();
  await wait(700);
  kbEl.classList.remove('on'); $('dim').classList.remove('on');
  reply.style.transform=''; reply.classList.remove('typing');
  field.textContent='메시지 보내기...'; field.classList.add('ph');
  replied=true; busy=false;
  await wait(400);
  elapsed=Math.min(elapsed, DUR[1]-1500); paused=false;
}
field.addEventListener('click', openReply);
function finish(){ if(ended) return; ended=true; bar(1).style.width='100%'; $('black').classList.add('on'); }

requestAnimationFrame(t=>{ last=t; loop(t); });
</script>
